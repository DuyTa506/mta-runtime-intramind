name: Runtime checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.31
      - run: make setup check test
      - run: make dev-up
      # Real PostgreSQL, Temporal replay and MinIO; no GPU or private AI checkout.
      - run: make integration
      - run: make build
      - name: Install the wheel in a clean environment
        run: |
          uv venv .test-data/wheel-env --python 3.12
          uv pip install --python .test-data/wheel-env/bin/python dist/*.whl
          uv pip check --python .test-data/wheel-env/bin/python
          .test-data/wheel-env/bin/intramind-runtime --help
      - name: Collect service diagnostics
        if: failure()
        run: |
          mkdir -p .test-data
          docker compose -p intramind-runtime-dev -f dev/compose.yaml logs --no-color > .test-data/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-test-results
          path: |
            .test-data/library.xml
            .test-data/services.log
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error
      - run: make dev-down
        if: always()
